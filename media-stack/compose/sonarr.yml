services:
  # Sonarr - TV Shows Management
  sonarr:
    image: lscr.io/linuxserver/sonarr:develop
    container_name: sonarr
    security_opt:
      - no-new-privileges:true
    restart: "no"
    profiles: ["media", "starr", "all"]
    networks:
      - default
      - t3_proxy
    #    ports:
      #      - "$SONARR_PORT:8989"
    volumes:
      - $APPDATADIR/sonarr:/config
      - $MEDIADIR1:/data/media1
      # - $MEDIADIR2:/data/media2
      # - $MEDIADIR3:/data/media3
      - $DOWNLOADSDIR:/data/downloads 
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.sonarr-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.sonarr-rtr.rule=Host(`sonarr.$DOMAINNAME_1`)"
      # Middlewares
      - "traefik.http.routers.sonarr-rtr.middlewares=chain-no-auth@file"
      # HTTP Services
      - "traefik.http.services.sonarr-svc.loadbalancer.server.port=8989"
      # Homepage
      - "homepage.group=Media-Management"
      - "homepage.name=Sonarr"
      - "homepage.href=http://sonarr.$DOMAINNAME_1/"
      - "homepage.description=Sonarr is a PVR for Usenet and BitTorrent users. It can monitor multiple RSS feeds for new episodes of your favorite shows and will grab, sort and rename them."        
