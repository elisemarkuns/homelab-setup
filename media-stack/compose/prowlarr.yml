services:
  # Prowlarr - Torrent proxy
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    security_opt:
      - no-new-privileges:true
    restart: always
    profiles: ["apps", "all"]
    networks:
      - default
      - t3_proxy
    ports:
      - "9696:9696"
    volumes:
      - $APPDATADIR/prowlarr:/config
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.prowlarr-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.prowlarr-rtr.rule=Host(`prowlarr.$DOMAINNAME_1`)"
      # Middlewares
      - "traefik.http.routers.prowlarr-rtr.middlewares=chain-no-auth@file"
      # HTTP Services
      - "traefik.http.services.prowlarr-svc.loadbalancer.server.port=9696"
      # Homepage
      - "homepage.group=Media-Management"
      - "homepage.name=prowlarr"
      - "homepage.href=http://prowlarr.$DOMAINNAME_1/"
      - "homepage.description=Prowlarr is an advanced, open-source media management tool designed to automate the process of finding, downloading, and organizing content from Usenet and torrent indexers. "
