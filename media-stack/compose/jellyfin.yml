services:
# Jellyfin - Media Server
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    security_opt:
      - no-new-privileges:true
    restart: "no"
    profiles: ["media", "all"]
    networks:
      - default
      - t3_proxy
    user: $PUID:$PGID
    devices:
      - /dev/dri:/dev/dri # for hardware transcoding
    ports:
      - "$JELLYFIN_PORT:8096"
      # - "8920:8920" # Emby also uses same port if running both
    environment:
      UMASK_SET: 022
      TZ: $TZ
    volumes:
      - $APPDATADIR/jellyfin:/config
      - $DOWNLOADSDIR:/data/downloads
      - $MEDIADIR1:/data/media1
      # - $MEDIADIR2:/data/media2
      # - $MEDIADIR3:/data/media3
      - /dev/shm:/data/transcode # Offload transcoding to RAM if you have enough RAM

    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.jellyfin-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.jellyfin-rtr.rule=Host(`jellyfin.$DOMAINNAME_1`)"
      # Middlewares
      - "traefik.http.routers.jellyfin-rtr.middlewares=chain-no-auth@file"
      # HTTP Services
      - "traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096"
      # Homepage
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.href=http://jellyfin.$DOMAINNAME_1/"
      - "homepage.description=The Free Software Media System"
